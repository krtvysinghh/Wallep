name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos-build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build WallepKit and Executables
        run: |
          cd Wallep-macOS
          swift build -c release
      - name: Run Test Suite
        run: |
          cd Wallep-macOS
          swift run wallep-tests
      - name: Verify Web Build
        run: |
          cd wallep-web
          npm ci
          npm run build
